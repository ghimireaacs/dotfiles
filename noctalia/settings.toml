config_version = 12

[bar.default]
background_opacity = 0.39999999105930328
capsule = true
margin_ends = 10
scale = 1.2000000104308128
thickness = 26
widget_spacing = 12

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hot_corners]
delay_ms = 2000

[location]
address = "Sydney"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell.animation]
speed = 1.1000000163912773

[shell.launcher.providers.wallpaper]
global = true

[shell.panel]
transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Green"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "ghostty", "niri" ]
    community_ids = [ "fuzzel", "fastfetch" ]

[wallpaper.default]
path = "/usr/local/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/local/share/noctalia/assets/noctalia-wallpaper.png"

[widget.brightness]
enabled = false

[widget.media]
enabled = false